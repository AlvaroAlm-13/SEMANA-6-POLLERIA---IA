<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agente WhatsApp - Pollería Chincha</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="text-center mb-4">
        <h1 class="display-6 fw-bold">Agente de pedidos por WhatsApp</h1>
        <p class="text-muted mb-0">Pollería Chincha · flujo en JSON</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body">
              <h2 class="h5 fw-semibold mb-3">JSON de prueba</h2>
              <textarea id="payload" class="form-control font-monospace" rows="18">[
  {
    "id": "m1",
    "phone": "+51987654321",
    "text": "Hola, a qué hora cierran?"
  },
  {
    "id": "m2",
    "phone": "+51987654321",
    "text": "Quiero 1 pollo entero con papas y una gaseosa de litro, delivery"
  },
  {
    "id": "m3",
    "phone": "+51987654321",
    "text": "Cuánto demora a Parcona?"
  },
  {
    "id": "m4",
    "phone": "+51987654321",
    "text": "Ya pagué por Yape, ahí te mando la captura"
  },
  {
    "id": "m5",
    "phone": "+51987654321",
    "text": "Mi pedido llegó frío, quiero mi dinero"
  }
]</textarea>
              <button id="simulateBtn" class="btn btn-primary mt-3">Simular mensajes</button>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-body">
              <h2 class="h5 fw-semibold mb-3">Respuesta del agente</h2>
              <pre id="result" class="bg-dark text-light rounded p-3 mb-0" style="min-height: 420px; white-space: pre-wrap;">Esperando simulación...</pre>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const payloadEl = document.getElementById('payload');
      const resultEl = document.getElementById('result');
      const simulateBtn = document.getElementById('simulateBtn');

      simulateBtn.addEventListener('click', async () => {
        try {
          const messages = JSON.parse(payloadEl.value);
          const response = await fetch('/api/simulate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages })
          });

          const data = await response.json();
          resultEl.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          resultEl.textContent = 'JSON inválido: ' + error.message;
        }
      });
    </script>
  </body>
</html>
